    <style>
        :root {
            --primary-bg: #000000;
            --surface-bg: #1A1A1C;
            --text-primary: #F5F5F2;
            --text-secondary: #8B8F96;
            --silver-accent: #C9CDD3;
            --hover-accent: #A88B91;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;

        }
        .font-body {
            font-family: 'Inter', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Liquid Glass Card Base */
        .liquid-glass {
            background: rgba(201, 205, 211, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(201, 205, 211, 0.15);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.03), 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 1.25rem;
        }

        /* Liquid Glass highlight border using gradient mask edge */
        .liquid-glass-border {
            position: relative;
            background: rgba(201, 205, 211, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 9999px; /* Pill shaped navbar and items */
        }
        
        .liquid-glass-border::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(201, 205, 211, 0.45) 0%, rgba(201, 205, 211, 0) 50%, rgba(201, 205, 211, 0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Strong Glass used ONLY for primary CTA */
        .liquid-glass-strong {
            position: relative;
            background: rgba(201, 205, 211, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 9999px; /* Pill */
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .liquid-glass-strong::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(201, 205, 211, 0.45) 0%, rgba(201, 205, 211, 0) 50%, rgba(201, 205, 211, 0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .liquid-glass-strong:hover {
            background: rgba(201, 205, 211, 0.15);
            box-shadow: 0 0 24px rgba(201, 205, 211, 0.12);
            color: var(--hover-accent) !important;
        }

        /* Scroll Progress Line */
        .scroll-progress-container {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 3px;
            background: rgba(255, 255, 255, 0.02);
            z-index: 9999;
            pointer-events: none;
        }

        .scroll-progress-bar {
            width: 100%;
            background: var(--silver-accent);
            transform-origin: top;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--primary-bg); }
        ::-webkit-scrollbar-thumb { background: var(--silver-accent); border-radius: 9999px; }
